name = "vve-meldingen"
main = "worker.mjs"
compatibility_date = "2026-09-07"
workers_dev = true

[vars]
ACCEPT_REPORTS = "true"
ALLOWED_ORIGIN = "https://vve-ogierssingel-bollandstraat.github.io"
KEY_ID = "v1"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "vve-meldingen-prive"
jurisdiction = "eu"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = false

# Set with `wrangler secret put`, never here:
# TAG_RANGES_JSON, ENCRYPTION_KEY, RATE_LIMIT_SECRET, TURNSTILE_SECRET_KEY,
# RESEND_API_KEY, NOTIFY_FROM, NOTIFY_TO (JSON array of authorised handlers).
